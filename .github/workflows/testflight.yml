name: Publish Voka iOS to TestFlight

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testflight:
    runs-on: macos-26
    environment: testflight
    env:
      APPLE_TEAM_ID: 5C4R48LJZC
      APPSTORE_API_KEY_ID: 27TM6KXCGU
      APPSTORE_ISSUER_ID: 69a6de81-6434-47e3-e053-5b8c7c11a4d1
      BUNDLE_ID: de.mhuhn.voka
      PROFILE_NAME: ${{ vars.IOS_APP_STORE_PROFILE_NAME }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Verify signing configuration
        env:
          P12: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          PROFILE: ${{ secrets.IOS_APP_STORE_PROFILE_BASE64 }}
          KEY_ID: ${{ env.APPSTORE_API_KEY_ID }}
          ISSUER: ${{ env.APPSTORE_ISSUER_ID }}
          API_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: |
          for value in "$P12" "$P12_PASSWORD" "$PROFILE" "$KEY_ID" "$ISSUER" "$API_KEY" "$PROFILE_NAME"; do
            if [ -z "$value" ]; then
              echo "::error::Missing TestFlight signing configuration. See docs/IOS_TESTFLIGHT.md"
              exit 1
            fi
          done
      - name: Install and build React
        run: |
          npm install --no-audit
          npm run build
      - name: Prepare Capacitor iOS project
        run: |
          if [ -d ios/App ]; then npx cap sync ios; else npx cap add ios; fi
          python3 - <<'PY'
          import plistlib
          from pathlib import Path
          p = Path("ios/App/App/Info.plist")
          with p.open("rb") as f: data = plistlib.load(f)
          types = data.get("CFBundleURLTypes", [])
          if not any("de.mhuhn.voka" in t.get("CFBundleURLSchemes", []) for t in types):
              types.append({"CFBundleURLName": "de.mhuhn.voka", "CFBundleURLSchemes": ["de.mhuhn.voka"]})
          data["CFBundleURLTypes"] = types
          with p.open("wb") as f: plistlib.dump(data, f)
          PY
      - name: Set Voka native app icon
        run: |
          # Capacitor's freshly generated iOS project contains its default
          # icon. Install the existing Voka PWA icon as the native app icon.
          ICON_SET="ios/App/App/Assets.xcassets/AppIcon.appiconset"
          test -s public/icon-512.png
          mkdir -p "$ICON_SET"
          sips -z 1024 1024 public/icon-512.png \
            --out "$ICON_SET/AppIcon-512@2x.png" >/dev/null
          python3 - <<'PY'
          import json
          from pathlib import Path
          folder = Path("ios/App/App/Assets.xcassets/AppIcon.appiconset")
          contents = {
              "images": [{
                  "filename": "AppIcon-512@2x.png",
                  "idiom": "universal",
                  "platform": "ios",
                  "size": "1024x1024",
              }],
              "info": {"author": "xcode", "version": 1},
          }
          (folder / "Contents.json").write_text(json.dumps(contents, indent=2) + "\n")
          PY
      - name: Import certificate and provisioning profile
        env:
          P12: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          PROFILE: ${{ secrets.IOS_APP_STORE_PROFILE_BASE64 }}
        run: |
          umask 077
          KEYCHAIN="$RUNNER_TEMP/voka-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          printf '%s' "$P12" | base64 -D > "$RUNNER_TEMP/cert.p12"
          printf '%s' "$PROFILE" | base64 -D > "$RUNNER_TEMP/profile.mobileprovision"
          # Linux OpenSSL 3 uses a PKCS#12 encryption/MAC format that Apple's
          # Security.framework may reject as "wrong password", even when valid.
          # First validate the secret and password, then rewrap for macOS.
          if ! openssl pkcs12 -in "$RUNNER_TEMP/cert.p12" -passin env:P12_PASSWORD -noout >/dev/null 2>&1; then
            echo "::error::The P12 or its password is invalid. Recheck IOS_DISTRIBUTION_P12_BASE64 and IOS_DISTRIBUTION_P12_PASSWORD."
            exit 1
          fi
          # PKCS#12 export reads PEM more than once, so a pipe (/dev/stdin)
          # cannot be used here. Keep the unencrypted PEM in the ephemeral
          # runner's private temporary directory, and delete it after rewrapping.
          openssl pkcs12 -in "$RUNNER_TEMP/cert.p12" \
            -passin env:P12_PASSWORD -nodes -out "$RUNNER_TEMP/extracted.pem"
          openssl pkcs12 -export -legacy \
            -in "$RUNNER_TEMP/extracted.pem" -out "$RUNNER_TEMP/cert-macos.p12" \
            -passout env:P12_PASSWORD -name "Voka Distribution" \
            -keypbe PBE-SHA1-3DES -certpbe PBE-SHA1-3DES -macalg sha1
          rm -f "$RUNNER_TEMP/extracted.pem"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert-macos.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          PROFILE_UUID="$(security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" | plutil -extract UUID raw -)"
          cp "$RUNNER_TEMP/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          echo "SIGNING_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
      - name: Archive iOS application
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Voka.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            CODE_SIGN_KEYCHAIN="$SIGNING_KEYCHAIN" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            archive
      - name: Export IPA
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>method</key><string>app-store-connect</string>
          <key>teamID</key><string>$APPLE_TEAM_ID</string>
          <key>signingStyle</key><string>manual</string>
          <key>provisioningProfiles</key><dict><key>$BUNDLE_ID</key><string>$PROFILE_NAME</string></dict>
          </dict></plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Voka.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
      - name: Upload IPA to TestFlight
        uses: apple-actions/upload-testflight-build@v5
        with:
          app-path: ${{ runner.temp }}/export/App.ipa
          issuer-id: ${{ env.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ env.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          wait-for-processing: 'false'
