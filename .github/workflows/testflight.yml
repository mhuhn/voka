name: Publish Voka iOS to TestFlight

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testflight:
    runs-on: macos-26
    environment: testflight
    env:
      APPLE_TEAM_ID: 5C4R48LJZC
      BUNDLE_ID: de.mhuhn.voka
      PROFILE_NAME: ${{ vars.IOS_APP_STORE_PROFILE_NAME }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify signing configuration
        env:
          P12: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          PROFILE: ${{ secrets.IOS_APP_STORE_PROFILE_BASE64 }}
          KEY_ID: ${{ vars.APPSTORE_API_KEY_ID }}
          ISSUER: ${{ vars.APPSTORE_ISSUER_ID }}
          API_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: |
          for value in "$P12" "$P12_PASSWORD" "$PROFILE" "$KEY_ID" "$ISSUER" "$API_KEY" "$PROFILE_NAME"; do
            if [ -z "$value" ]; then
              echo "::error::Missing TestFlight signing configuration. See docs/IOS_TESTFLIGHT.md"
              exit 1
            fi
          done
      - name: Install and build React
        run: |
          npm install --no-audit
          npm run build
      - name: Prepare Capacitor iOS project
        run: |
          if [ -d ios/App ]; then npx cap sync ios; else npx cap add ios; fi
          python3 - <<'PY'
          import plistlib
          from pathlib import Path
          p = Path("ios/App/App/Info.plist")
          with p.open("rb") as f: data = plistlib.load(f)
          types = data.get("CFBundleURLTypes", [])
          if not any("de.mhuhn.voka" in t.get("CFBundleURLSchemes", []) for t in types):
              types.append({"CFBundleURLName": "de.mhuhn.voka", "CFBundleURLSchemes": ["de.mhuhn.voka"]})
          data["CFBundleURLTypes"] = types
          with p.open("wb") as f: plistlib.dump(data, f)
          PY
      - name: Import certificate and provisioning profile
        env:
          P12: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          PROFILE: ${{ secrets.IOS_APP_STORE_PROFILE_BASE64 }}
        run: |
          umask 077
          KEYCHAIN="$RUNNER_TEMP/voka-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          echo "$PROFILE" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          PROFILE_UUID="$(security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" | plutil -extract UUID raw -)"
          cp "$RUNNER_TEMP/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          echo "SIGNING_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
      - name: Archive iOS application
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Voka.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            CODE_SIGN_KEYCHAIN="$SIGNING_KEYCHAIN" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            archive
      - name: Export IPA
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>method</key><string>app-store-connect</string>
          <key>teamID</key><string>$APPLE_TEAM_ID</string>
          <key>signingStyle</key><string>manual</string>
          <key>provisioningProfiles</key><dict><key>$BUNDLE_ID</key><string>$PROFILE_NAME</string></dict>
          </dict></plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Voka.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
      - name: Upload IPA to TestFlight
        uses: apple-actions/upload-testflight-build@v5
        with:
          app-path: ${{ runner.temp }}/export/App.ipa
          issuer-id: ${{ vars.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ vars.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
