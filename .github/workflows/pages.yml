name: Deploy both Voka versions to GitHub Pages

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["React application checks"]
    branches: [react]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out existing static site
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-site
          persist-credentials: false

      - name: Check out React application
        uses: actions/checkout@v4
        with:
          ref: react
          fetch-depth: 0
          path: react-source
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Assemble existing main version
        shell: bash
        run: |
          mkdir -p published
          rsync -a --exclude='.git/' --exclude='.github/' main-site/ published/
          touch published/.nojekyll

      - name: Install React dependencies
        working-directory: react-source
        run: npm install --no-audit

      - name: Build React for its GitHub Pages subdirectory
        working-directory: react-source
        env:
          VITE_PAGES_BASE: /voka/react/
        run: npm run build

      - name: Add React site without replacing the original
        shell: bash
        run: |
          mkdir -p published/react
          cp -a react-source/dist/. published/react/
          test -f published/index.html
          test -f published/react/index.html
          test -f published/react/sw.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload combined Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: published

      # GitHub's artifact index can lag behind successful uploads.
      # A fresh run avoids duplicate github-pages artifacts from job reruns.
      - name: Wait until the Pages artifact is indexed
        uses: actions/github-script@v7
        with:
          script: |
            const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
            for (let attempt = 1; attempt <= 20; attempt++) {
              const { data } = await github.rest.actions.listWorkflowRunArtifacts({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: context.runId,
                per_page: 100
              });
              const matches = data.artifacts.filter(
                artifact => artifact.name === "github-pages" && !artifact.expired
              );
              if (matches.length > 1) {
                throw new Error("Multiple github-pages artifacts in this run. Trigger a fresh workflow run instead of rerunning the failed job.");
              }
              if (matches.length === 1) {
                core.info("Pages artifact is indexed: " + matches[0].id);
                await sleep(3000);
                return;
              }
              core.info("Waiting for Pages artifact to appear (" + attempt + "/20)");
              await sleep(3000);
            }
            throw new Error("Pages artifact is not visible in the Actions API after 60 seconds");

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
