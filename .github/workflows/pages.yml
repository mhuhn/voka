name: Deploy Voka React to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit

      - name: Build React for /voka/
        env:
          VITE_PAGES_BASE: /voka/
        run: npm run build

      - name: Verify Pages artifact
        run: |
          test -f dist/index.html
          test -f dist/sw.js
          touch dist/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Wait for Pages artifact to be indexed
        uses: actions/github-script@v7
        with:
          script: |
            const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
            for (let attempt = 1; attempt <= 20; attempt++) {
              const { data } = await github.rest.actions.listWorkflowRunArtifacts({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: context.runId,
                per_page: 100
              });
              const matches = data.artifacts.filter(
                artifact => artifact.name === "github-pages" && !artifact.expired
              );
              if (matches.length > 1) {
                throw new Error("Multiple github-pages artifacts; trigger a fresh workflow run");
              }
              if (matches.length === 1) {
                await sleep(3000);
                return;
              }
              await sleep(3000);
            }
            throw new Error("Pages artifact is not visible after 60 seconds");

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
