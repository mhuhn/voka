<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Voka</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Voka">

<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d1424" media="(prefers-color-scheme: dark)">
<style>
:root{
  --bg:#ffffff; --surface:#f4f7fd; --ink:#0b1f4a; --muted:#5a6a8c; --line:#dce4f1;
  --accent:#0b63f0; --accent-ink:#ffffff; --accent-soft:#e3edff; --orange:#f9a11b;
  --ok:#2a7a58; --ok-ink:#ffffff; --no-soft:#f6e1df; --no-ink:#a3322a;
  --rule:#f9a11b; --ruled:#dbe6f4;
  --shadow:0 1px 2px rgba(11,31,74,.08),0 12px 30px rgba(11,31,74,.14);
  --display:ui-rounded,"SF Pro Rounded","Nunito","Arial Rounded MT Bold","Avenir Next",system-ui,sans-serif;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0d1424; --surface:#162038; --ink:#eaf0ff; --muted:#9aa9c9; --line:#26345a;
    --accent:#6aa6ff; --accent-ink:#06142e; --accent-soft:#1c2c50; --orange:#ffb13b;
    --ok:#52bb8d; --ok-ink:#07251a; --no-soft:#3a2224; --no-ink:#f4a8a1;
    --rule:#ffb13b; --ruled:#252f48;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 30px rgba(0,0,0,.35);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:17px/1.4 var(--sans);-webkit-text-size-adjust:100%;touch-action:manipulation}
html,body{overflow:hidden}
body{overscroll-behavior:none;-webkit-user-select:none;user-select:none}
input,textarea{-webkit-user-select:text;user-select:text}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{opacity:.45;cursor:default}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,p,ul{margin:0}
ul{padding:0;list-style:none}

#app{position:fixed;inset:0;display:flex;justify-content:center}
.screen{width:100%;max-width:520px;height:100%;display:flex;flex-direction:column;padding-top:calc(52px + var(--sat))}

/* Kopfzeile: fest am oberen Rand, voll breit und einfarbig deckend (inkl. Statusleisten-Bereich).
   iOS blendet an so einer Kante keinen Unschärfe-Verlauf ein. Kein Transparenz-/Blur-Effekt hinzufügen! */
.bar{position:fixed;top:0;left:0;right:0;z-index:30;width:100%;max-width:520px;margin:0 auto;height:calc(52px + var(--sat));padding:var(--sat) 6px 0;background:var(--bg);display:grid;grid-template-columns:96px 1fr 96px;align-items:center}
.bar>:first-child{justify-self:start}
.bar>:last-child{justify-self:end}
.bar-title{font:700 1.02rem var(--display);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px}
.icon-btn{min-width:44px;height:44px;border:0;background:none;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;color:var(--accent);padding:0 8px}
.icon-btn.txt{font-weight:600;padding:0 10px}
.icon-btn svg{display:block}

.body{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:6px 20px calc(28px + var(--sab))}
.foot{flex:none;padding:10px 20px calc(14px + var(--sab));background:var(--bg)}

.display{font:800 2.6rem/1.05 var(--display);letter-spacing:-.015em}
.display.brand{position:relative;display:inline-block;padding-bottom:14px}
.display.brand::after{content:"";position:absolute;left:2px;bottom:0;width:62%;height:7px;border-radius:4px;background:var(--orange);transform:rotate(-1.5deg);transform-origin:left center}
.hero{padding:18px 0 22px}
.sub{color:var(--muted);margin-top:8px;font-size:1.0625rem}
.lead{color:var(--muted);margin:2px 0 16px;font-size:.98rem}
.note{color:var(--muted);font-size:.92rem}
h2{font:700 1.1875rem/1.2 var(--display)}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;margin:26px 0 12px}
.sec-head:first-child{margin-top:6px}
.trow{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:10px}
.trow .row-title{display:block}
.trash-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.adv{margin:0 0 14px}
.adv summary{cursor:pointer;color:var(--muted);font-size:.92rem;padding:6px 0;list-style:none}
.adv summary::-webkit-details-marker{display:none}
.adv summary::before{content:"▸ "}
.adv[open] summary::before{content:"▾ "}
.advgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.adv .note{margin-top:2px}
.sheet-label{font-weight:600;margin:6px 0 4px}
.selrows{display:grid;gap:8px;margin:2px 0 12px;max-height:38vh;overflow-y:auto}
.selrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:11px 14px;min-height:52px}
.selrow .box{flex:none;width:24px;height:24px;border-radius:7px;border:2px solid var(--muted);position:relative}
.selrow[aria-checked=true]{border-color:var(--accent);background:var(--accent-soft)}
.selrow[aria-checked=true] .box{background:var(--accent);border-color:var(--accent)}
.selrow[aria-checked=true] .box::after{content:"";position:absolute;left:6px;top:2px;width:6px;height:11px;border:solid var(--accent-ink);border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
.selrow-t{font:700 1.05rem/1.25 var(--display);overflow-wrap:anywhere}
.selrow-t small{display:block;font:400 .88rem var(--sans);color:var(--muted)}
.listtools{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.btn.small{min-height:42px;font-size:.95rem;border-radius:12px;padding:0 10px}
.link{border:0;background:none;color:var(--accent);font-weight:600;padding:8px 0 8px 12px;font-size:.98rem}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;border-radius:14px;border:1px solid transparent;font-weight:600;font-size:1.0625rem;padding:0 20px;background:var(--surface);color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.quiet{background:transparent;border-color:var(--line)}
.btn.ok{background:var(--ok);color:var(--ok-ink)}
.btn.no{background:var(--no-soft);color:var(--no-ink)}
.btn.danger{background:transparent;border-color:var(--line);color:var(--no-ink)}
.btn.big{min-height:68px;border-radius:18px;flex-direction:column;gap:1px;font-family:var(--display);font-weight:700;font-size:1.4rem}
.btn.big small{font:400 .86rem var(--sans);opacity:.8}

.rows{display:grid;gap:10px}
.row{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;position:relative}
.row-main{display:flex;align-items:center;gap:12px}
.row-text{flex:1;min-width:0}
.row-title{font:700 1.1875rem/1.25 var(--display);overflow-wrap:anywhere}
.row-meta{color:var(--muted);font-size:.9rem;margin-top:3px}
.row .chev{color:var(--muted);flex:none}
.btn svg{width:20px;height:20px;flex:none}
.bigt{display:inline-flex;align-items:center;gap:8px}
.bigt svg{width:22px;height:22px;flex:none}
.icon-btn.txt svg{width:18px;height:18px;margin-right:5px}
.btn.small svg{width:18px;height:18px}
.link svg{width:16px;height:16px;vertical-align:-3px;margin-right:5px}
.bubble.emo{font-size:1.5rem;background:var(--surface);border:1px solid var(--line)}
.emojis{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin-bottom:4px}
.emojis button{aspect-ratio:1;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:1.25rem;line-height:1;padding:0}
.emojis button[aria-pressed=true]{border-color:var(--accent);background:var(--accent-soft)}
/* kleiner oranger Akzent auf jedem Screen */
.bar-title::after{content:"";display:block;width:20px;height:3px;border-radius:2px;background:var(--orange);margin:3px auto 0}
.display:not(.brand)::after{content:"";display:block;width:40px;height:5px;border-radius:3px;background:var(--orange);margin-top:10px}
.bubble{flex:none;width:44px;height:44px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;font:600 1.25rem var(--display)}
.meter{height:4px;background:var(--line);border-radius:2px;margin-top:10px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--orange);border-radius:2px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag{font-size:.82rem;color:var(--accent);background:var(--accent-soft);border-radius:10px;padding:2px 9px}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:16px;padding:22px 18px;color:var(--muted);text-align:center}
.banner{display:block;width:100%;margin-top:18px;text-align:left;background:var(--accent-soft);color:var(--accent);border:0;border-radius:14px;padding:12px 14px;font-size:.93rem}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:40px;padding:0 15px;border-radius:20px;border:1px solid var(--line);background:var(--surface);font-size:.98rem}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chips.small .chip{min-height:34px;padding:0 12px;font-size:.88rem}
.match{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-top:20px}
.match strong{font-family:var(--display);font-size:1.1rem}
.match ul{margin-top:8px;color:var(--muted);font-size:.93rem}
.switch{display:flex;align-items:center;gap:12px;margin-top:18px;min-height:44px;font-size:1rem}
.switch input{width:22px;height:22px;accent-color:var(--accent)}

.field{display:block;margin:0 0 14px}
.field>span{display:block;font-size:.875rem;color:var(--muted);margin-bottom:6px}
.field input,.field textarea{width:100%;min-height:50px;border:1px solid var(--line);border-radius:12px;padding:12px 14px;font:400 1.0625rem var(--sans);background:var(--bg);color:var(--ink)}
.field textarea{min-height:140px;resize:vertical;font-size:.9rem;font-family:ui-monospace,Menlo,monospace}
.addcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 16px 4px}
.addcard .btn{margin:0 0 12px}

.cardrow{display:flex;align-items:center;gap:12px}
.cardrow .row-title{font-weight:500;font-size:1.06rem}
.cardrow .row-meta{margin-top:1px;font-size:.95rem}
.dots{display:inline-flex;gap:5px;flex:none}
.hd{display:inline-flex;align-items:center;gap:12px}
.markbtn{background:none;border:0;padding:6px;margin:-6px;color:var(--muted);display:inline-flex;cursor:pointer;-webkit-tap-highlight-color:transparent}
.markbtn svg{width:26px;height:26px}
.markbtn[aria-pressed=true]{color:var(--orange)}
.markbtn[aria-pressed=true] svg{fill:var(--orange)}
.rowstar{width:14px;height:14px;vertical-align:-2px;margin-left:5px;color:var(--orange);fill:var(--orange)}
.cardrow .side{display:flex;flex-direction:column;align-items:flex-end;gap:7px;flex:none}
.rounds{min-width:26px;text-align:center;font:600 .78rem/1 var(--sans,system-ui);color:var(--muted);border:1px solid var(--line);border-radius:9px;padding:3px 6px;background:var(--surface)}
.rounds.done{color:var(--ok);border-color:var(--ok)}
.row.lv1{background:#f1f6ee;background:color-mix(in srgb,var(--ok) 9%,var(--surface))}
.row.lv2{background:#e4efdf;background:color-mix(in srgb,var(--ok) 18%,var(--surface))}
.row.lv3{background:#d5e7cf;background:color-mix(in srgb,var(--ok) 30%,var(--surface))}
.switch{display:flex;align-items:center;gap:8px;font-size:.93rem;color:var(--muted)}
.switch button{width:46px;height:28px;border-radius:14px;border:1px solid var(--line);background:var(--surface);position:relative;padding:0}
.switch button::after{content:"";position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:var(--muted);transition:transform .2s}
.switch button[aria-pressed=true]{background:var(--accent-soft);border-color:var(--accent)}
.switch button[aria-pressed=true]::after{transform:translateX(18px);background:var(--accent)}
.chip.flag{font-size:1.25rem;padding:0 11px}
.chips.small .chip.flag{font-size:1.15rem;padding:0 10px}
.flags{margin-right:6px;font-style:normal;white-space:nowrap}
.dots i{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--muted);display:block}
.dots i.on{background:var(--ok);border-color:var(--ok)}

.sheet-wrap{position:fixed;left:0;right:0;top:0;height:100%;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet-bg{position:absolute;inset:0;background:rgba(10,14,24,.5);opacity:0;transition:opacity .2s}
.sheet{position:relative;width:100%;max-width:520px;max-height:100%;overflow-y:auto;background:var(--surface);border-radius:22px 22px 0 0;padding:20px 20px calc(18px + var(--sab));transform:translateY(24px);opacity:0;transition:transform .22s ease,opacity .22s}
.sheet-wrap.in .sheet-bg{opacity:1}
.sheet-wrap.in .sheet{transform:none;opacity:1}
.sheet-title{font:800 1.35rem/1.2 var(--display);margin-bottom:14px}
.sheet p{color:var(--muted);margin-bottom:16px}
.sheet-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.sheet-actions.one{grid-template-columns:1fr}
.sheet-sep{height:10px}
.filterbar{display:flex;justify-content:space-between;align-items:center;margin:-2px 0 10px}
.err,.sheet .err{background:var(--no-soft);color:var(--no-ink);border-radius:10px;padding:10px 12px;font-size:.92rem;margin:-6px 0 14px}
.center-note{text-align:center;margin-top:8px}
.match li.dim{opacity:.7}

.toast{position:fixed;left:50%;bottom:calc(24px + var(--sab));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:22px;font-size:.95rem;z-index:80;max-width:88%;text-align:center}

.progress{flex:none;height:4px;margin:0 20px;background:var(--line);border-radius:2px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--orange);transition:width .3s}
.stage{flex:1;min-height:0;display:flex;padding:14px 20px 12px;overflow:hidden;touch-action:none}
.actions,.progress{touch-action:none}
.flip{position:relative;flex:1;perspective:1400px;cursor:pointer}
.flip-in{position:absolute;inset:0;transition:transform .55s cubic-bezier(.2,.75,.25,1);transform-style:preserve-3d;-webkit-transform-style:preserve-3d}
.flip.on .flip-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:20px;background:var(--surface);box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.face.back{transform:rotateY(180deg)}
.face-head{flex:none;height:62px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 20px 10px;color:var(--muted);font-size:.92rem;border-bottom:2px solid var(--rule)}
.face-body{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:18px 24px;text-align:center;background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 35px,var(--ruled) 35px,var(--ruled) 36px);position:relative}
.word{touch-action:pan-y;font:600 clamp(1.75rem,8.5vw,2.6rem)/1.2 var(--display);overflow-wrap:anywhere;max-height:100%;overflow-y:auto;background:var(--surface);padding:2px 10px;border-radius:6px}
.word.long{font-size:clamp(1.3rem,6vw,1.8rem)}
.hint{position:absolute;left:50%;transform:translateX(-50%);bottom:12px;white-space:nowrap;background:var(--surface);padding:2px 12px;border-radius:6px;color:var(--muted);font-size:.88rem}
.actions{flex:none;display:flex;gap:12px;padding:6px 20px calc(16px + var(--sab))}
.actions .btn{min-height:60px;font-size:1.05rem;padding:0 8px;white-space:nowrap;flex:1}

.center{text-align:center}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:26px 0}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 6px}
.stat b{display:block;font:800 1.6rem var(--display)}
.stat span{color:var(--muted);font-size:.85rem}

@media (max-height:700px){
  .hero{padding:6px 0 14px}
  .display{font-size:2.1rem}
  .face-head{height:54px}
}
@media (prefers-reduced-motion:reduce){
  .flip-in,.sheet,.sheet-bg,.progress i{transition:none}
}
</style>

<div id="app"></div>

<noscript>Diese App braucht JavaScript.</noscript>
<script>
(() => {
'use strict';

/*LOGIC-START*/
const GOAL = 3;                 // so oft in Folge gewusst = Karte gelernt
const GAPS = [2, 6, 19];        // Runden bis zur nächsten Abfrage: nach "nicht gewusst" / 1x / 2x richtig in Folge
const PAUSES = [1, 3, 10, 30, 60, 120, 240, 480, 960]; // wählbare Pausen in Minuten (pro Profil)
const DEFAULT_PAUSE = 120;      // Standard für neue Profile: 2 Stunden

const lc = s => String(s).toLowerCase();
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function clean(v, max) { return String(v == null ? '' : v).replace(/\s+/g, ' ').trim().slice(0, max); }

// Tags: durch Leerzeichen getrennt; Kleinbuchstaben, Ziffern, Punkt, Bindestrich und Emojis; beginnt mit einem Buchstaben oder Emoji.
// Großbuchstaben zählen als Kleinbuchstaben.
const EMO_START = '\\p{Extended_Pictographic}\\u{1F1E6}-\\u{1F1FF}';
const EMO_MORE = EMO_START + '\\p{Emoji_Modifier}\\uFE0F\\u200D';
const TAG_RE = new RegExp('^[\\p{Ll}' + EMO_START + '][\\p{Ll}\\d.\\-' + EMO_MORE + ']{0,29}$', 'u');
function parseTags(str) {
  const seen = new Set(), tags = [], invalid = [];
  String(str || '').split(/\s+/).forEach(raw => {
    const t = lc(raw);
    if (!t) return;
    if (!TAG_RE.test(t)) { if (!invalid.includes(t)) invalid.push(t); return; }
    if (!seen.has(t)) { seen.add(t); tags.push(t); }
  });
  return { tags, invalid };
}
// Macht alte oder importierte Tags gültig (z. B. "Unit 3" -> "unit-3")
function normalizeTag(raw) {
  let t = lc(raw == null ? '' : raw).trim().replace(/\s+/g, '-').replace(new RegExp('[^\\p{Ll}\\d.\\-' + EMO_MORE + ']', 'gu'), '');
  t = t.replace(new RegExp('^[^\\p{Ll}' + EMO_START + ']+', 'u'), '');
  return Array.from(t).slice(0, 30).join('');
}
function tagsOfProfile(p) {
  const set = new Set();
  p.lists.forEach(l => l.tags.forEach(t => set.add(lc(t))));
  return [...set].map(t => ({ key: t, label: t })).sort((a, b) => a.label.localeCompare(b.label, 'de'));
}
// Listen, in denen ALLE gewählten Tags vorkommen (ohne Auswahl: alle Listen)
function listsWithTags(p, selectedKeys) {
  const sel = selectedKeys.map(lc);
  return p.lists.filter(l => {
    const have = new Set(l.tags.map(lc));
    return sel.every(t => have.has(t));
  });
}
function isDone(c) { return c.streak >= GOAL; }
function countCards(lists) {
  let total = 0, done = 0;
  lists.forEach(l => l.cards.forEach(c => { total++; if (isDone(c)) done++; }));
  return { total, done, open: total - done };
}
function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// Eine Abfrage ist eine Runde. Jede Liste zählt ihre Runden (round); jede Karte merkt sich,
// ab welcher Runde sie wieder dran ist (due). Gibt es in der nächsten Runde nichts zu fragen,
// springt die Liste zur frühesten fälligen Karte vor.
function lockLeft(l, now, pauseMin) { return Math.max(0, (l.lastEnd || 0) + pauseMin * 60000 - now); }
function openCardsOf(l) { return l.cards.filter(c => !isDone(c)); }
function effRound(l) {
  const open = openCardsOf(l);
  if (!open.length) return l.round;
  return Math.max(l.round, Math.min(...open.map(c => c.due)));
}
function pendingCount(l, onlyMarked) {
  const e = effRound(l);
  return openCardsOf(l).filter(c => c.due <= e && (!onlyMarked || c.mark)).length;
}
function newSession(lists, includeDone, now, pauseMin, onlyMarked) {
  const info = {}, queue = [], used = [], cards = {};
  lists.forEach(l => {
    if (lockLeft(l, now, pauseMin) > 0) return;
    if (includeDone) l.cards.forEach(c => { if (isDone(c) && (!onlyMarked || c.mark)) { c.streak = 0; c.due = 0; } });
    const e = effRound(l);

  const tags = tagList(p);
  homeFilter = homeFilter.filter(k => tags.some(t => t.key === k));

function pickLists() { return listsWithTags(P(), pick.tags); }
function viewPick() {
  const p = P(), now = Date.now();
  const tags = tagList(p);
  const lists = pickLists();
  const free = lists.filter(l => lockLeft(l, now, p.pause) === 0);
  const om = pick.onlyMarked;
  const n = free.reduce((k, l) => k + (pick.includeDone ? l.cards.filter(c => !om || c.mark).length : pendingCount(l, om)), 0);
  const marked = lists.reduce((k, l) => k + l.cards.filter(c => c.mark).length, 0);
  let head;
  if (!lists.length) head = 'Keine passende Liste';
  else if (!free.length) head = 'Alle passenden Listen machen Pause';
  else head = nn(free.length, 'Liste', 'Listen') + ', ' + nn(n, 'Karte', 'Karten') + ' bereit';
  const items = lists.map(l => {
    const left = lockLeft(l, now, p.pause);
    return '<li' + (left ? ' class="dim"' : '') + '>' + esc(l.title) + (left && pendingCount(l) ? ' (' + nn(pendingCount(l), 'Karte', 'Karten') + ' in ' + lockText(left) + ')' : '') + '</li>';
  }).join('');
  const match = '<strong>' + head + '</strong>' + (lists.length ? '<ul>' + items + '</ul>' : '<ul><li>Keine Liste hat alle gewählten Tags.</li></ul>');

    '<main class="body"><p class="lead">' + (tags.length ?
      'Wähle Tags, um mehrere Listen zu mischen. Abgefragt werden nur Listen, die alle gewählten Tags haben. Ohne Auswahl kommen alle Listen dran.' :
      'Noch keine Tags vergeben. Tags kannst du bei jeder Liste hinzufügen. Bis dahin werden alle Listen abgefragt.') + '</p>' +

let lastKey = '';
let lastSig = '';
function render() {
  if (route.name !== 'profiles' && route.name !== 'settings' && !P()) route = { name: 'profiles' };
  if (route.name === 'list' && !L()) route = { name: 'home' };
  if (route.name === 'quiz' && (!session || !session.queue.length)) route = session ? { name: 'result' } : { name: 'home' };
  const key = route.name + ':' + (route.id || '');
  const sc = $('.body') && key === lastKey ? $('.body').scrollTop : 0;
  const views = { profiles: viewProfiles, home: viewHome, list: viewList, pick: viewPick, trash: viewTrash, quiz: viewQuiz, result: viewResult, settings: viewSettings };
  $('#app').innerHTML = views[route.name]();
  decorate($('#app'));
  lastKey = key;
  lastSig = lockSig();
  const b = $('.body'); if (b && sc) b.scrollTop = sc;
}
// Pausen laufen ab, während die App offen ist: Anzeige auffrischen, aber nie beim Tippen
function refreshLocks() {
  if (!['home', 'list', 'pick'].includes(route.name) || $('.sheet-wrap')) return;

}
setInterval(refreshLocks, 15000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) refreshLocks(); });

}

// ---------- Sichern / Wiederherstellen ----------
function exportObj() { return { app: 'vokabelkarten', version: 1, exported: new Date().toISOString(), profiles: db.profiles }; }
function markBackup() { db.lastBackup = Date.now(); save(); if (route.name === 'settings') render(); }
async function exportFile() {
  const json = JSON.stringify(exportObj(), null, 2);
  const name = 'vokabeln-' + new Date().toISOString().slice(0, 10) + '.json';
  try {
    const file = new File([json], name, { type: 'application/json' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: 'Vokabeln Sicherung' });
      markBackup(); return;
    }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  const url = URL.createObjectURL(new Blob([json], { type: 'application/json' }));
  const a = document.createElement('a'); a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  markBackup();
}
async function shareLists(lists, withProgress) {
  const json = JSON.stringify(exportListsObj(lists, withProgress));
  if (navigator.share) {
    try { await navigator.share({ text: json }); return; }
    catch (e) { if (e && e.name === 'AbortError') return; }
  }
  try { await navigator.clipboard.writeText(json); toast('Kopiert. Füge den Text z. B. in eine Nachricht ein.'); return; } catch (e) {}
  openSheet('<h2 class="sheet-title">' + (lists.length === 1 ? 'Liste teilen' : 'Listen teilen') + '</h2><p>Markiere den Text, kopiere ihn und schicke ihn weiter.</p>' +
    '<label class="field"><span>Liste</span><textarea readonly id="out">' + esc(json) + '</textarea></label>' +
    '<div class="sheet-actions one"><button class="btn primary" data-a="sheet-close">Fertig</button></div>',
    w => { const t = $('#out', w); t.focus(); t.select(); });
}
function addImportedList(text) {
  const r = parseListImport(text);
  if (r.error) return r.error;
  const p = P();
  r.lists.forEach(l => { l.title = uniqueTitle(p.lists, l.title); p.lists.push(l); });
  save(); closeSheet(); showAnswers = false;
  if (r.lists.length === 1) {
    const l = r.lists[0];
    go({ name: 'list', id: l.id });
    toast('„' + l.title + '“ importiert (' + nn(l.cards.length, 'Karte', 'Karten') + ')');
  } else {
    go({ name: 'home' });
    toast(nn(r.lists.length, 'Liste', 'Listen') + ' importiert (' + nn(r.lists.reduce((n, l) => n + l.cards.length, 0), 'Karte', 'Karten') + ')');
  }
  return null;
}

async function importFromClipboard() {

async function exportText() {
  const json = JSON.stringify(exportObj());
  try { await navigator.clipboard.writeText(json); toast('Kopiert. Füge den Text z. B. in eine Notiz ein.'); markBackup(); return; } catch (e) {}
  openSheet('<h2 class="sheet-title">Text kopieren</h2><p>Markiere den Text, kopiere ihn und speichere ihn z. B. in einer Notiz.</p>' +
    '<label class="field"><span>Sicherung</span><textarea readonly id="out">' + esc(json) + '</textarea></label>' +
    '<div class="sheet-actions one"><button class="btn primary" data-a="sheet-close">Fertig</button></div>',
    w => { const t = $('#out', w); t.focus(); t.select(); });

function importText(text) {
  let d;
  try { d = JSON.parse(text); } catch (e) { toast('Das ist keine gültige Sicherung.'); return; }
  const list = d && Array.isArray(d.profiles) ? d.profiles : null;
  if (!list || !list.length) { toast('In der Sicherung sind keine Profile.'); return; }
  const incoming = list.map(sanitizeProfile);
  const names = incoming.map(p => p.name).join(', ');
  closeSheet();
  confirmSheet('Sicherung laden?', 'Gefunden: ' + names + '. Profile mit gleicher Kennung werden ersetzt, alle anderen bleiben erhalten.', 'Laden', () => {
    incoming.forEach(p => {
      const i = db.profiles.findIndex(x => x.id === p.id);
      if (i >= 0) db.profiles[i] = p; else db.profiles.push(p);
    });
    if (!P()) db.lastProfile = null;
    save(); closeSheet(); render(); toast('Sicherung geladen.');
  });
}

function startQuiz(lists, includeDone, origin, onlyMarked) {
  const s = newSession(lists, includeDone, Date.now(), P().pause, onlyMarked);
  if (!s.queue.length) { toast('Gerade sind keine Karten bereit.'); render(); return; }
  s.origin = origin; session = s; save();
  go({ name: 'quiz' });
}
function reply(knew) {
  const s = session; if (!s || !s.revealed) return;
  const last = answer(s, knew);
  if (last) finishSession(s, Date.now());
  save();
  go({ name: last ? 'result' : 'quiz' });
}

const forms = {
  profile(f) {
    const name = clean(f.name.value, 40); if (!name) { f.name.focus(); return; }
    const id = f.dataset.id, emoji = f.emoji ? firstEmoji(f.emoji.value) : null;
    if (id) { const q = db.profiles.find(p => p.id === id); q.name = name; if (emoji !== null) q.emoji = emoji; }
    else {
      const p = { id: uid(), name, emoji: emoji || '', pause: DEFAULT_PAUSE, lists: [], trash: [] }; db.profiles.push(p);
      if (route.name === 'profiles') { db.lastProfile = p.id; homeFilter = []; route = { name: 'home' }; }
    }
    save(); closeSheet(); render();
  },
  list(f) {
    const title = clean(f.title.value, 80); if (!title) { f.title.focus(); return; }
    const r = parseTags(f.tags.value);
    if (r.invalid.length) {
      const er = $('#tagerr');
      er.textContent = 'Ungültig: „' + r.invalid.join('“, „') + '“. Ein Tag beginnt mit einem Buchstaben oder Emoji und besteht nur aus Kleinbuchstaben, Ziffern, Punkt, Bindestrich und Emojis. Mehrere Tags trennst du mit Leerzeichen.';
      er.hidden = false; f.tags.focus(); return;
    }
    const tags = r.tags, id = f.dataset.id, p = P();
    const dl = defaultLabels(tags);
    const labelQ = clean(f.labelq.value, 30) || dl.q, labelA = clean(f.labela.value, 30) || dl.a;
    if (id) { const l = p.lists.find(x => x.id === id); l.title = title; l.tags = tags; l.labelQ = labelQ; l.labelA = labelA; save(); closeSheet(); render(); }
    else { const l = { id: uid(), title, tags, labelQ, labelA, round: 0, lastEnd: 0, cards: [] }; p.lists.push(l); save(); closeSheet(); showAnswers = false; go({ name: 'list', id: l.id }); }
  },
  card(f) {
    const de = clean(f.de.value, 200), fl = clean(f.fl.value, 200);
    if (!de || !fl) { (de ? f.fl : f.de).focus(); return; }
    const c = L().cards.find(x => x.id === f.dataset.id);
    if (termKey(de) !== termKey(c.de)) {
      const dup = findDup(L(), de, c.id);
      if (dup) {
        const er = $('#editerr');
        er.textContent = '„' + dup.de + '“ gibt es in dieser Liste schon (' + dup.fl + '). Jeder Begriff darf nur einmal vorkommen.';
        er.hidden = false; f.de.focus(); return;
      }
    }
    c.de = de; c.fl = fl;
    const a = readAdv(f); c.streak = a.streak; c.due = a.due;
    save(); closeSheet(); render();
  },
  'add-card'(f) {
    const de = clean(f.de.value, 200), fl = clean(f.fl.value, 200);
    if (!de || !fl) { (de ? f.fl : f.de).focus(); return; }
    const dup = findDup(L(), de, null);
    if (dup) {
      const er = $('#adderr');
      er.textContent = '„' + dup.de + '“ gibt es in dieser Liste schon (' + dup.fl + '). Jeder Begriff darf nur einmal vorkommen.';
      er.hidden = false; f.de.focus(); return;
    }
    const a = readAdv(f);
    L().cards.push({ id: uid(), de, fl, streak: a.streak, due: a.due });
    advMemory = (a.streak || a.due) ? a : null;
    save(); render();
    const inp = $('input[name=de]'); if (inp) inp.focus();
  },
  paste(f) { importText(f.text.value); },
  'paste-list'(f) {
    const err = addImportedList(f.text.value);
    if (err) { const er = $('#pasteerr'); er.textContent = err; er.hidden = false; }
  }
};

// ---------- Ereignisse ----------
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]');
  if (!el || el.disabled) return;
  const fn = actions[el.dataset.a];
  if (fn) fn(el, e);
});
document.addEventListener('change', e => {
  if (e.target.matches('input[type=checkbox][data-a]')) actions[e.target.dataset.a](e.target);
});
document.addEventListener('input', e => {
  const i = e.target;
  if (i.matches && i.matches('input[name=emoji]')) {
    const v = firstEmoji(i.value); if (v !== i.value) i.value = v;
    document.querySelectorAll('#emojis button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === i.value)));
  } else if (i.matches && i.matches('input[name=tags]')) {
    const a = i.selectionStart, b = i.selectionEnd, low = i.value.toLowerCase();
    if (low !== i.value) { i.value = low; try { i.setSelectionRange(a, b); } catch (_) {} }
    const er = $('#tagerr'); if (er) er.hidden = true;
    if (i.form && i.form.labelq) { const d = defaultLabels(parseTags(i.value).tags); i.form.labelq.placeholder = d.q; i.form.labela.placeholder = d.a; }
  } else if (i.matches && i.matches('input[name=de]') && i.form) {
    const er = $(i.form.dataset.form === 'card' ? '#editerr' : '#adderr'); if (er) er.hidden = true;
  }
});
document.addEventListener('submit', e => {
  const fn = forms[e.target.dataset.form];
  if (fn) { e.preventDefault(); fn(e.target); }
});
document.addEventListener('keydown', e => {
  if (e.target.matches && e.target.matches('input[name=de]') && e.key === 'Enter' && e.target.form && e.target.form.dataset.form === 'add-card') {
    e.preventDefault(); e.target.form.fl.focus(); return;
  }
  if (route.name !== 'quiz' || !session || $('.sheet-wrap')) return;
  if (e.key === ' ' || e.key === 'Enter') {
    if (!session.revealed) { e.preventDefault(); actions['quiz-flip'](); }
  } else if (session.revealed && e.key === 'ArrowRight') reply(true);
  else if (session.revealed && e.key === 'ArrowLeft') reply(false);
});
$('#file').addEventListener('change', e => {
  const f = e.target.files && e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => importText(String(r.result));
  r.onerror = () => toast('Die Datei konnte nicht gelesen werden.');
  r.readAsText(f);
});

render();
// ---------- Updates ----------
// Neu laden, sobald nichts Wichtiges offen ist (nie mitten in der Abfrage, bei offenem Dialog oder beim Tippen)
let reloading = false;
const reloadWhenIdle = () => {
  if (reloading) return;
  const el = document.activeElement;
  const typing = el && /^(INPUT|TEXTAREA)$/.test(el.tagName);
  const busy = route.name === 'quiz' || route.name === 'result' || $('.sheet-wrap') || typing;
  if (busy) { setTimeout(reloadWhenIdle, 3000); return; }
  reloading = true; location.reload();
};
// Fragt den Server (mit eindeutiger Adresse, am Cache vorbei) nach der aktuellen Version
let lastCheck = 0;
async function checkForUpdate() {
  if (reloading || Date.now() - lastCheck < 20000) return;
  lastCheck = Date.now();
  try {
    const res = await fetch('index.html?_=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) return;
    const m = (await res.text()).match(/const VERSION = '([^']+)'/);
    if (!m || m[1] === VERSION) return;
    let tried = null;
    try { tried = sessionStorage.getItem('vk.reload'); sessionStorage.setItem('vk.reload', m[1]); } catch (_) {}
    if (tried !== m[1]) reloadWhenIdle();   // höchstens ein Versuch pro Version und Sitzung
  } catch (e) {}
}
if ('serviceWorker' in navigator) {
  const hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (hadController) reloadWhenIdle(); });
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').then(reg => {
      document.addEventListener('visibilitychange', () => { if (!document.hidden) reg.update().catch(() => {}); });
    }).catch(() => {});
  });
}
window.addEventListener('load', () => setTimeout(checkForUpdate, 500));
document.addEventListener('visibilitychange', () => { if (!document.hidden) checkForUpdate(); });
window.addEventListener('pageshow', e => { if (e.persisted) checkForUpdate(); });
})();
</script>
</body>
