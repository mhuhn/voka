<html lang="de">
<head>

<style>
:root{
  --bg:#e8ecf1; --surface:#fffefb; --ink:#1b2333; --muted:#5f6a84; --line:#d3dae6;
  --accent:#243b6b; --accent-ink:#ffffff; --accent-soft:#dbe3f2;
  --ok:#2a7a58; --ok-ink:#ffffff; --no-soft:#f6e1df; --no-ink:#a3322a;
  --rule:#d9534a; --ruled:#dbe6f4;
  --shadow:0 1px 2px rgba(27,35,51,.08),0 12px 30px rgba(27,35,51,.12);
  --serif:ui-serif,"New York","Iowan Old Style",Georgia,"Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#10151f; --surface:#1b2232; --ink:#e9edf6; --muted:#9aa5bd; --line:#2b3550;
    --accent:#a9bff0; --accent-ink:#0d1526; --accent-soft:#222c46;
    --ok:#52bb8d; --ok-ink:#07251a; --no-soft:#3a2224; --no-ink:#f4a8a1;
    --rule:#e46a61; --ruled:#252f48;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 30px rgba(0,0,0,.35);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:17px/1.4 var(--sans);-webkit-text-size-adjust:100%;touch-action:manipulation}
body{overscroll-behavior:none;-webkit-user-select:none;user-select:none}
input,textarea{-webkit-user-select:text;user-select:text}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{opacity:.45;cursor:default}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,p,ul{margin:0}
ul{padding:0;list-style:none}

#app{position:fixed;inset:0;display:flex;justify-content:center}
.screen{width:100%;max-width:520px;height:100%;display:flex;flex-direction:column;padding-top:var(--sat)}

.bar{flex:none;height:52px;display:grid;grid-template-columns:96px 1fr 96px;align-items:center;padding:0 6px}
.bar>:first-child{justify-self:start}
.bar>:last-child{justify-self:end}
.bar-title{font:600 1rem var(--sans);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px}
.icon-btn{min-width:44px;height:44px;border:0;background:none;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;color:var(--accent);padding:0 8px}
.icon-btn.txt{font-weight:600;padding:0 10px}
.icon-btn svg{display:block}

.body{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:6px 20px calc(28px + var(--sab))}
.foot{flex:none;padding:10px 20px calc(14px + var(--sab));background:var(--bg)}

.display{font:600 2.5rem/1.05 var(--serif);letter-spacing:-.01em}
.hero{padding:18px 0 22px}
.sub{color:var(--muted);margin-top:8px;font-size:1.0625rem}
.lead{color:var(--muted);margin:2px 0 16px;font-size:.98rem}
.note{color:var(--muted);font-size:.92rem}
h2{font:600 1.1875rem/1.2 var(--serif)}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;margin:26px 0 12px}
.sec-head:first-child{margin-top:6px}
.link{border:0;background:none;color:var(--accent);font-weight:600;padding:8px 0 8px 12px;font-size:.98rem}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;border-radius:14px;border:1px solid transparent;font-weight:600;font-size:1.0625rem;padding:0 20px;background:var(--surface);color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.quiet{background:transparent;border-color:var(--line)}
.btn.ok{background:var(--ok);color:var(--ok-ink)}
.btn.no{background:var(--no-soft);color:var(--no-ink)}
.btn.danger{background:transparent;border-color:var(--line);color:var(--no-ink)}
.btn.big{min-height:68px;border-radius:18px;flex-direction:column;gap:1px;font-family:var(--serif);font-size:1.4rem}
.btn.big small{font:400 .86rem var(--sans);opacity:.8}

.rows{display:grid;gap:10px}
.row{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;position:relative}
.row-main{display:flex;align-items:center;gap:12px}
.row-text{flex:1;min-width:0}
.row-title{font:600 1.1875rem/1.25 var(--serif);overflow-wrap:anywhere}
.row-meta{color:var(--muted);font-size:.9rem;margin-top:3px}
.row .chev{color:var(--muted);flex:none}
.bubble{flex:none;width:44px;height:44px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;font:600 1.25rem var(--serif)}
.meter{height:4px;background:var(--line);border-radius:2px;margin-top:10px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--ok);border-radius:2px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag{font-size:.82rem;color:var(--accent);background:var(--accent-soft);border-radius:10px;padding:2px 9px}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:16px;padding:22px 18px;color:var(--muted);text-align:center}
.banner{display:block;width:100%;margin-top:18px;text-align:left;background:var(--accent-soft);color:var(--accent);border:0;border-radius:14px;padding:12px 14px;font-size:.93rem}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:40px;padding:0 15px;border-radius:20px;border:1px solid var(--line);background:var(--surface);font-size:.98rem}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chips.small .chip{min-height:34px;padding:0 12px;font-size:.88rem}
.match{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-top:20px}
.match strong{font-family:var(--serif);font-size:1.1rem}
.match ul{margin-top:8px;color:var(--muted);font-size:.93rem}
.switch{display:flex;align-items:center;gap:12px;margin-top:18px;min-height:44px;font-size:1rem}
.switch input{width:22px;height:22px;accent-color:var(--accent)}

.field{display:block;margin:0 0 14px}
.field>span{display:block;font-size:.875rem;color:var(--muted);margin-bottom:6px}
.field input,.field textarea{width:100%;min-height:50px;border:1px solid var(--line);border-radius:12px;padding:12px 14px;font:400 1.0625rem var(--sans);background:var(--bg);color:var(--ink)}
.field textarea{min-height:140px;resize:vertical;font-size:.9rem;font-family:ui-monospace,Menlo,monospace}
.addcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 16px 4px}
.addcard .btn{margin:0 0 12px}

.cardrow{display:flex;align-items:center;gap:12px}
.cardrow .row-title{font-weight:500;font-size:1.06rem}
.cardrow .row-meta{margin-top:1px;font-size:.95rem}
.dots{display:inline-flex;gap:5px;flex:none}
.dots i{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--muted);display:block}
.dots i.on{background:var(--ok);border-color:var(--ok)}

.sheet-wrap{position:fixed;left:0;right:0;top:0;height:100%;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet-bg{position:absolute;inset:0;background:rgba(10,14,24,.5);opacity:0;transition:opacity .2s}
.sheet{position:relative;width:100%;max-width:520px;max-height:100%;overflow-y:auto;background:var(--surface);border-radius:22px 22px 0 0;padding:20px 20px calc(18px + var(--sab));transform:translateY(24px);opacity:0;transition:transform .22s ease,opacity .22s}
.sheet-wrap.in .sheet-bg{opacity:1}
.sheet-wrap.in .sheet{transform:none;opacity:1}
.sheet-title{font:600 1.35rem/1.2 var(--serif);margin-bottom:14px}
.sheet p{color:var(--muted);margin-bottom:16px}
.sheet-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.sheet-actions.one{grid-template-columns:1fr}
.sheet-sep{height:10px}
.sheet .err{background:var(--no-soft);color:var(--no-ink);border-radius:10px;padding:10px 12px;font-size:.92rem;margin:-6px 0 14px}
.center-note{text-align:center;margin-top:8px}
.match li.dim{opacity:.7}

.toast{position:fixed;left:50%;bottom:calc(24px + var(--sab));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:22px;font-size:.95rem;z-index:80;max-width:88%;text-align:center}

.progress{flex:none;height:4px;margin:0 20px;background:var(--line);border-radius:2px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);transition:width .3s}
.stage{flex:1;min-height:0;display:flex;padding:14px 20px 12px}
.flip{position:relative;flex:1;perspective:1400px;cursor:pointer}
.flip-in{position:absolute;inset:0;transition:transform .55s cubic-bezier(.2,.75,.25,1);transform-style:preserve-3d;-webkit-transform-style:preserve-3d}
.flip.on .flip-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:20px;background:var(--surface);box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.face.back{transform:rotateY(180deg)}
.face-head{flex:none;height:62px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 20px 10px;color:var(--muted);font-size:.92rem;border-bottom:2px solid var(--rule)}
.face-body{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:18px 24px;text-align:center;background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 35px,var(--ruled) 35px,var(--ruled) 36px);position:relative}
.word{font:500 clamp(1.75rem,8.5vw,2.6rem)/1.2 var(--serif);overflow-wrap:anywhere;max-height:100%;overflow-y:auto;background:var(--surface);padding:2px 10px;border-radius:6px}
.word.long{font-size:clamp(1.3rem,6vw,1.8rem)}
.hint{position:absolute;left:50%;transform:translateX(-50%);bottom:12px;white-space:nowrap;background:var(--surface);padding:2px 12px;border-radius:6px;color:var(--muted);font-size:.88rem}
.actions{flex:none;display:flex;gap:12px;padding:6px 20px calc(16px + var(--sab))}
.actions .btn{min-height:60px;font-size:1.05rem;padding:0 8px;white-space:nowrap;flex:1}

.center{text-align:center}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:26px 0}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 6px}
.stat b{display:block;font:600 1.6rem var(--serif)}
.stat span{color:var(--muted);font-size:.85rem}

@media (max-height:700px){
  .hero{padding:6px 0 14px}
  .display{font-size:2.1rem}
  .face-head{height:54px}
}
@media (prefers-reduced-motion:reduce){
  .flip-in,.sheet,.sheet-bg,.progress i{transition:none}
}
</style>

<body>
<div id="app"></div>
<input type="file" id="file" accept="application/json,.json" hidden>
<noscript>Diese App braucht JavaScript.</noscript>
<script>
(() => {
'use strict';

/*LOGIC-START*/
const GOAL = 3;                 // so oft in Folge gewusst = Karte gelernt
const GAPS = [2, 6, 19];        // Runden bis zur nächsten Abfrage: nach "nicht gewusst" / 1x / 2x richtig in Folge
const LOCK_MS = 10 * 60 * 1000; // Pause einer Liste nach dem Ende ihrer Abfrage

const lc = s => String(s).toLowerCase();
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function clean(v, max) { return String(v == null ? '' : v).replace(/\s+/g, ' ').trim().slice(0, max); }

// Tags: durch Leerzeichen getrennt; Kleinbuchstaben, Ziffern, Punkt, Bindestrich; beginnt mit einem Buchstaben.
// Großbuchstaben zählen als Kleinbuchstaben.
const TAG_RE = /^\p{Ll}[\p{Ll}\d.\-]{0,29}$/u;
function parseTags(str) {
  const seen = new Set(), tags = [], invalid = [];
  String(str || '').split(/\s+/).forEach(raw => {
    const t = lc(raw);
    if (!t) return;
    if (!TAG_RE.test(t)) { if (!invalid.includes(t)) invalid.push(t); return; }
    if (!seen.has(t)) { seen.add(t); tags.push(t); }
  });
  return { tags, invalid };
}
// Macht alte oder importierte Tags gültig (z. B. "Unit 3" -> "unit-3")
function normalizeTag(raw) {
  let t = lc(raw == null ? '' : raw).trim().replace(/\s+/g, '-').replace(/[^\p{Ll}\d.\-]/gu, '');
  t = t.replace(/^[^\p{Ll}]+/u, '');
  return t.slice(0, 30);
}
function tagsOfProfile(p) {
  const set = new Set();
  p.lists.forEach(l => l.tags.forEach(t => set.add(lc(t))));
  return [...set].map(t => ({ key: t, label: t })).sort((a, b) => a.label.localeCompare(b.label, 'de'));
}
// Listen, in denen ALLE gewählten Tags vorkommen (ohne Auswahl: alle Listen)
function listsWithTags(p, selectedKeys) {
  const sel = selectedKeys.map(lc);
  return p.lists.filter(l => {
    const have = new Set(l.tags.map(lc));
    return sel.every(t => have.has(t));
  });
}
function isDone(c) { return c.streak >= GOAL; }
function countCards(lists) {
  let total = 0, done = 0;
  lists.forEach(l => l.cards.forEach(c => { total++; if (isDone(c)) done++; }));
  return { total, done, open: total - done };
}
function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// Eine Abfrage ist eine Runde. Jede Liste zählt ihre Runden (round); jede Karte merkt sich,
// ab welcher Runde sie wieder dran ist (due). Gibt es in der nächsten Runde nichts zu fragen,
// springt die Liste zur frühesten fälligen Karte vor.
function lockLeft(l, now) { return Math.max(0, (l.lastEnd || 0) + LOCK_MS - now); }
function openCardsOf(l) { return l.cards.filter(c => !isDone(c)); }
function effRound(l) {
  const open = openCardsOf(l);
  if (!open.length) return l.round;
  return Math.max(l.round, Math.min(...open.map(c => c.due)));
}
function pendingCount(l) {
  const e = effRound(l);
  return openCardsOf(l).filter(c => c.due <= e).length;
}
function newSession(lists, includeDone, now) {
  const info = {}, queue = [], used = [], cards = {};
  lists.forEach(l => {
    if (lockLeft(l, now) > 0) return;
    if (includeDone) l.cards.forEach(c => { if (isDone(c)) { c.streak = 0; c.due = 0; } });
    const e = effRound(l);
    let n = 0;
    l.cards.forEach(c => {
      if (!isDone(c) && c.due <= e) { info[c.id] = { list: l, eff: e }; cards[c.id] = c; queue.push(c.id); n++; }
    });
    if (n) used.push({ list: l, eff: e });
  });
  shuffle(queue);
  return { queue, cards, info, lists: used, total: queue.length, answers: 0, wrong: 0, learned: new Set(), revealed: false, undo: null, finished: null };
}
// Liefert true, wenn die letzte Karte beantwortet wurde
function answer(s, knew) {
  if (!s.queue.length) return false;
  const id = s.queue[0], c = s.cards[id], eff = s.info[id].eff;
  s.undo = { queue: s.queue.slice(), id, streak: c.streak, due: c.due, answers: s.answers, wrong: s.wrong, learned: new Set(s.learned) };
  s.queue.shift();
  s.answers++;
  s.revealed = false;
  if (knew) {
    c.streak++;
    if (c.streak >= GOAL) s.learned.add(id);
    else c.due = eff + GAPS[c.streak];
  } else {
    s.wrong++;
    c.streak = 0;
    c.due = eff + GAPS[0];
  }
  return s.queue.length === 0;
}
function undoAnswer(s) {
  if (!s.undo) return false;
  const u = s.undo, c = s.cards[u.id];
  s.queue = u.queue; c.streak = u.streak; c.due = u.due;
  s.answers = u.answers; s.wrong = u.wrong; s.learned = u.learned;
  s.undo = null; s.revealed = false;
  return true;
}
function finishSession(s, now) {
  s.finished = s.lists.map(x => ({ list: x.list, round: x.list.round, lastEnd: x.list.lastEnd }));
  s.lists.forEach(x => { x.list.round = x.eff + 1; x.list.lastEnd = now; });
}
function unfinishSession(s) {
  if (!s.finished) return;
  s.finished.forEach(f => { f.list.round = f.round; f.list.lastEnd = f.lastEnd; });
  s.finished = null;
}
// Abbruch: bereits beantwortete Karten bleiben geplant, die Liste bekommt keine Pause
function abortSession(s) {
  s.lists.forEach(x => { x.list.round = Math.max(x.list.round, x.eff); });
}
function sanitizeProfile(p) {
  p = p || {};
  return {
    id: clean(p.id, 40) || uid(),
    name: clean(p.name, 40) || 'Profil',
    lists: (Array.isArray(p.lists) ? p.lists : []).map(l => {
      l = l || {};
      return {
        id: clean(l.id, 40) || uid(),
        title: clean(l.title, 80) || 'Liste',
        tags: [...new Set((Array.isArray(l.tags) ? l.tags : []).map(normalizeTag).filter(Boolean))],
        round: Math.max(0, parseInt(l.round, 10) || 0),
        lastEnd: Math.min(Date.now(), Math.max(0, Number(l.lastEnd) || 0)),
        cards: (Array.isArray(l.cards) ? l.cards : []).map(c => {
          c = c || {};
          return {
            id: clean(c.id, 40) || uid(),
            de: clean(c.de, 200), fl: clean(c.fl, 200),
            streak: Math.max(0, Math.min(GOAL, parseInt(c.streak, 10) || 0)),
            due: Math.max(0, parseInt(c.due, 10) || 0)
          };
        }).filter(c => c.de || c.fl)
      };
    })
  };
}
/*LOGIC-END*/

// ---------- Speicher ----------
const KEY = 'vokabelkarten.v1';
const VERSION = '1.1';
let db = loadDb();
function loadDb() {
  let raw = null;
  try { raw = localStorage.getItem(KEY); } catch (e) {}
  if (raw) {
    try {
      const d = JSON.parse(raw);
      if (d && Array.isArray(d.profiles)) {
        return { profiles: d.profiles.map(sanitizeProfile), lastProfile: d.lastProfile || null, lastBackup: d.lastBackup || null };
      }
    } catch (e) {
      try { localStorage.setItem(KEY + '.defekt', raw); } catch (_) {}
    }
  }
  return { profiles: [], lastProfile: null, lastBackup: null };
}
let warned = false;
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(db)); }
  catch (e) {
    if (!warned) { warned = true; toast('Speichern ist auf diesem Gerät gerade nicht möglich.'); }
  }
}
if (navigator.storage && navigator.storage.persist) { try { navigator.storage.persist(); } catch (e) {} }

// ---------- Hilfen ----------
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const nn = (k, one, many) => k + ' ' + (k === 1 ? one : many);
const svg = d => '<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + d + '</svg>';
const I = {
  back: svg('<path d="M15 5l-7 7 7 7"/>'),
  chev: svg('<path d="M9 5l7 7-7 7"/>'),
  save: svg('<path d="M12 4v11M8 11l4 4 4-4M5 19h14"/>'),
  undo: svg('<path d="M9 14L4 9l5-5"/><path d="M4 9h9a6 6 0 010 12h-3"/>')
};
let toastTimer;
function toast(msg) {
  const old = $('.toast'); if (old) old.remove();
  const t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); t.textContent = msg;
  document.body.appendChild(t);
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.remove(), 2600);
}

const P = () => db.profiles.find(p => p.id === db.lastProfile);
const L = () => { const p = P(); return p && route.id ? p.lists.find(l => l.id === route.id) : null; };
const dots = c => '<span class="dots" role="img" aria-label="' + c.streak + ' von ' + GOAL + ' in Folge gewusst">' +
  [0, 1, 2].map(i => '<i class="' + (i < c.streak ? 'on' : '') + '"></i>').join('') + '</span>';
const lockMin = ms => Math.ceil(ms / 60000) + ' Min.';
const readyOf = (l, now) => lockLeft(l, now) > 0 ? 0 : pendingCount(l);
function lockSig() {
  const now = Date.now();
  return db.profiles.map(p => p.lists.map(l => Math.ceil(lockLeft(l, now) / 60000)).join(',')).join(';');
}
function backupNote() {
  const total = db.profiles.reduce((n, p) => n + countCards(p.lists).total, 0);
  if (!total) return '';
  const old = !db.lastBackup || Date.now() - db.lastBackup > 30 * 864e5;
  if (!old) return '';

function viewHome() {

// ---------- Rendern ----------
let lastKey = '';
let lastSig = '';
function render() {
  if (route.name !== 'profiles' && route.name !== 'settings' && !P()) route = { name: 'profiles' };
  if (route.name === 'list' && !L()) route = { name: 'home' };
  if (route.name === 'quiz' && (!session || !session.queue.length)) route = session ? { name: 'result' } : { name: 'home' };
  const key = route.name + ':' + (route.id || '');
  const sc = $('.body') && key === lastKey ? $('.body').scrollTop : 0;
  const views = { profiles: viewProfiles, home: viewHome, list: viewList, pick: viewPick, quiz: viewQuiz, result: viewResult, settings: viewSettings };
  $('#app').innerHTML = views[route.name]();
  lastKey = key;
  lastSig = lockSig();
  const b = $('.body'); if (b && sc) b.scrollTop = sc;
}
// Pausen laufen ab, während die App offen ist: Anzeige auffrischen, aber nie beim Tippen
function refreshLocks() {
  if (!['home', 'list', 'pick'].includes(route.name) || $('.sheet-wrap')) return;
  const a = document.activeElement;
  if (a && a.matches && a.matches('input,textarea')) return;
  if (lockSig() !== lastSig) render();
}
setInterval(refreshLocks, 15000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) refreshLocks(); });
const go = (r) => { route = r; render(); };

// ---------- Sheets ----------
function fitSheet() {
  const w = $('.sheet-wrap'), v = window.visualViewport;
  if (!w || !v) return;
  w.style.top = v.offsetTop + 'px';
  w.style.height = v.height + 'px';
}
if (window.visualViewport) {
  visualViewport.addEventListener('resize', fitSheet);
  visualViewport.addEventListener('scroll', fitSheet);
}
function openSheet(html, onMount) {

  w.className = 'sheet-wrap';
  w.innerHTML = '<div class="sheet-bg" data-a="sheet-close"></div><div class="sheet" role="dialog" aria-modal="true">' + html + '</div>';
  document.body.appendChild(w);
  fitSheet();
  requestAnimationFrame(() => w.classList.add('in'));
  if (onMount) onMount(w);
}
function closeSheet() { const w = $('.sheet-wrap'); if (w) w.remove(); }
let pendingConfirm = null;

}

// ---------- Sichern / Wiederherstellen ----------
function exportObj() { return { app: 'vokabelkarten', version: 1, exported: new Date().toISOString(), profiles: db.profiles }; }
function markBackup() { db.lastBackup = Date.now(); save(); if (route.name === 'settings') render(); }
async function exportFile() {
  const json = JSON.stringify(exportObj(), null, 2);
  const name = 'vokabeln-' + new Date().toISOString().slice(0, 10) + '.json';
  try {
    const file = new File([json], name, { type: 'application/json' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: 'Vokabeln Sicherung' });
      markBackup(); return;
    }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  const url = URL.createObjectURL(new Blob([json], { type: 'application/json' }));
  const a = document.createElement('a'); a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  markBackup();
}
async function exportText() {
  const json = JSON.stringify(exportObj());
  try { await navigator.clipboard.writeText(json); toast('Kopiert. Füge den Text z. B. in eine Notiz ein.'); markBackup(); return; } catch (e) {}
  openSheet('<h2 class="sheet-title">Text kopieren</h2><p>Markiere den Text, kopiere ihn und speichere ihn z. B. in einer Notiz.</p>' +
    '<label class="field"><span>Sicherung</span><textarea readonly id="out">' + esc(json) + '</textarea></label>' +
    '<div class="sheet-actions one"><button class="btn primary" data-a="sheet-close">Fertig</button></div>',
    w => { const t = $('#out', w); t.focus(); t.select(); });
  markBackup();
}
function importText(text) {
  let d;
  try { d = JSON.parse(text); } catch (e) { toast('Das ist keine gültige Sicherung.'); return; }
  const list = d && Array.isArray(d.profiles) ? d.profiles : null;
  if (!list || !list.length) { toast('In der Sicherung sind keine Profile.'); return; }
  const incoming = list.map(sanitizeProfile);
  const names = incoming.map(p => p.name).join(', ');
  closeSheet();
  confirmSheet('Sicherung laden?', 'Gefunden: ' + names + '. Profile mit gleicher Kennung werden ersetzt, alle anderen bleiben erhalten.', 'Laden', () => {
    incoming.forEach(p => {
      const i = db.profiles.findIndex(x => x.id === p.id);
      if (i >= 0) db.profiles[i] = p; else db.profiles.push(p);
    });
    if (!P()) db.lastProfile = null;
    save(); closeSheet(); render(); toast('Sicherung geladen.');
  });
}

  'add-profile'() { sheetProfile(); },
  'settings'() { go({ name: 'settings' }); },
  'leave-settings'() { go(P() ? { name: 'home' } : { name: 'profiles' }); },
  'rename-profile'(el) { sheetProfile(el.dataset.id); },
  'delete-profile'(el) {
    const p = db.profiles.find(x => x.id === el.dataset.id); if (!p) return;
    confirmSheet('Profil löschen?', '„' + p.name + '“ wird mit allen Listen und Karten gelöscht. Das lässt sich nicht rückgängig machen.', 'Löschen', () => {
      db.profiles = db.profiles.filter(x => x.id !== p.id);
      if (db.lastProfile === p.id) db.lastProfile = null;
      save(); closeSheet(); render();
    });
  },
  'to-home'() { go({ name: 'home' }); },
  'new-list'() { sheetList(); },
  'open-list'(el) { go({ name: 'list', id: el.dataset.id }); },
  'edit-list'() { sheetList(route.id); },
  'add-tag-text'(el) {
    const inp = $('.sheet input[name=tags]'); if (!inp) return;
    inp.value = [...new Set((inp.value + ' ' + el.dataset.v).toLowerCase().split(/\s+/).filter(Boolean))].join(' ');
  },
  'del-list'() {
    const l = L();
    confirmSheet('Liste löschen?', '„' + l.title + '“ mit ' + nn(l.cards.length, 'Karte', 'Karten') + ' wird gelöscht. Das lässt sich nicht rückgängig machen.', 'Löschen', () => {
      const p = P(); p.lists = p.lists.filter(x => x.id !== l.id);
      save(); closeSheet(); go({ name: 'home' });
    });
  },
  'reset-progress'() {
    const l = L();
    confirmSheet('Fortschritt zurücksetzen?', 'Alle Karten in dieser Liste gelten wieder als neu.', 'Zurücksetzen', () => {
      l.cards.forEach(c => { c.streak = 0; c.due = 0; }); save(); closeSheet(); render();
    });
  },
  'edit-card'(el) { sheetCard(el.dataset.id); },
  'del-card'(el) {
    const l = L(); l.cards = l.cards.filter(c => c.id !== el.dataset.id);
    save(); closeSheet(); render();
  },
  'to-pick'() { pick = { tags: [], includeDone: false }; go({ name: 'pick' }); },
  'toggle-tag'(el) {
    const k = el.dataset.v, i = pick.tags.indexOf(k);
    if (i >= 0) pick.tags.splice(i, 1); else pick.tags.push(k);
    render();
  },
  'toggle-incl'(el) { pick.includeDone = el.checked; render(); },
  'start-quiz'() { startQuiz(pickLists(), pick.includeDone, { name: 'home' }); },
  'quiz-list'() {
    const l = L();
    startQuiz([l], countCards([l]).open === 0, { name: 'list', id: l.id });
  },
  'quiz-flip'() {
    const s = session; if (!s || s.revealed || route.name !== 'quiz') return;
    s.revealed = true;
    $('.flip').classList.add('on');
    $('#actions').innerHTML = actionsHtml(s);
  },
  'quiz-yes'() { reply(true); },
  'quiz-no'() { reply(false); },
  'quiz-undo'() {
    if (!session) return;
    if (route.name === 'result') unfinishSession(session);
    if (undoAnswer(session)) { save(); go({ name: 'quiz' }); }
    else if (route.name === 'result') { finishSession(session, Date.now()); save(); }
  },
  'quiz-exit'() {
    const r = session ? session.origin : { name: 'home' };
    if (session) { abortSession(session); save(); }
    session = null; go(r);
  },
  'quiz-done'() { const r = session ? session.origin : { name: 'home' }; session = null; go(r); },
  'export-file'() { exportFile(); },
  'export-text'() { exportText(); },
  'import-file'() { const f = $('#file'); f.value = ''; f.click(); },
  'import-text'() {
    openSheet('<h2 class="sheet-title">Text einfügen</h2><form data-form="paste"><label class="field"><span>Sicherung</span><textarea name="text" spellcheck="false"></textarea></label>' +
      '<div class="sheet-actions"><button type="button" class="btn quiet" data-a="sheet-close">Abbrechen</button><button class="btn primary" type="submit">Weiter</button></div></form>',
      w => $('textarea', w).focus());
  }
};

function startQuiz(lists, includeDone, origin) {
  const s = newSession(lists, includeDone, Date.now());
  if (!s.queue.length) { toast('Gerade sind keine Karten bereit.'); render(); return; }
  s.origin = origin; session = s; save();
  go({ name: 'quiz' });
}
function reply(knew) {
  const s = session; if (!s || !s.revealed) return;
  const last = answer(s, knew);
  if (last) finishSession(s, Date.now());
  save();
  go({ name: last ? 'result' : 'quiz' });
}

const forms = {
  profile(f) {
    const name = clean(f.name.value, 40); if (!name) { f.name.focus(); return; }
    const id = f.dataset.id;
    if (id) { db.profiles.find(p => p.id === id).name = name; }
    else {
      const p = { id: uid(), name, lists: [] }; db.profiles.push(p);
      if (route.name === 'profiles') { db.lastProfile = p.id; route = { name: 'home' }; }
    }
    save(); closeSheet(); render();
  },
  list(f) {
    const title = clean(f.title.value, 80); if (!title) { f.title.focus(); return; }
    const r = parseTags(f.tags.value);
    if (r.invalid.length) {
      const er = $('#tagerr');
      er.textContent = 'Ungültig: „' + r.invalid.join('“, „') + '“. Ein Tag beginnt mit einem Buchstaben und besteht nur aus Kleinbuchstaben, Ziffern, Punkt und Bindestrich. Mehrere Tags trennst du mit Leerzeichen.';
      er.hidden = false; f.tags.focus(); return;
    }
    const tags = r.tags, id = f.dataset.id, p = P();
    if (id) { const l = p.lists.find(x => x.id === id); l.title = title; l.tags = tags; save(); closeSheet(); render(); }
    else { const l = { id: uid(), title, tags, round: 0, lastEnd: 0, cards: [] }; p.lists.push(l); save(); closeSheet(); go({ name: 'list', id: l.id }); }
  },
  card(f) {
    const de = clean(f.de.value, 200), fl = clean(f.fl.value, 200);
    if (!de || !fl) { (de ? f.fl : f.de).focus(); return; }
    const c = L().cards.find(x => x.id === f.dataset.id); c.de = de; c.fl = fl;
    save(); closeSheet(); render();
  },
  'add-card'(f) {
    const de = clean(f.de.value, 200), fl = clean(f.fl.value, 200);
    if (!de || !fl) { (de ? f.fl : f.de).focus(); return; }
    L().cards.push({ id: uid(), de, fl, streak: 0, due: 0 });
    save(); render();
    const inp = $('input[name=de]'); if (inp) inp.focus();
  },
  paste(f) { importText(f.text.value); }
};

// ---------- Ereignisse ----------
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]');
  if (!el || el.disabled) return;
  const fn = actions[el.dataset.a];
  if (fn) fn(el, e);
});
document.addEventListener('change', e => {
  if (e.target.matches('input[type=checkbox][data-a]')) actions[e.target.dataset.a](e.target);
});
document.addEventListener('input', e => {
  const i = e.target;
  if (i.matches && i.matches('input[name=tags]')) {
    const a = i.selectionStart, b = i.selectionEnd, low = i.value.toLowerCase();
    if (low !== i.value) { i.value = low; try { i.setSelectionRange(a, b); } catch (_) {} }
    const er = $('#tagerr'); if (er) er.hidden = true;
  }
});
document.addEventListener('submit', e => {
  const fn = forms[e.target.dataset.form];
  if (fn) { e.preventDefault(); fn(e.target); }
});
document.addEventListener('keydown', e => {
  if (e.target.matches && e.target.matches('input[name=de]') && e.key === 'Enter' && e.target.form && e.target.form.dataset.form === 'add-card') {
    e.preventDefault(); e.target.form.fl.focus(); return;
  }
  if (route.name !== 'quiz' || !session || $('.sheet-wrap')) return;
  if (e.key === ' ' || e.key === 'Enter') {
    if (!session.revealed) { e.preventDefault(); actions['quiz-flip'](); }
  } else if (session.revealed && e.key === 'ArrowRight') reply(true);
  else if (session.revealed && e.key === 'ArrowLeft') reply(false);
});
$('#file').addEventListener('change', e => {
  const f = e.target.files && e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => importText(String(r.result));
  r.onerror = () => toast('Die Datei konnte nicht gelesen werden.');
  r.readAsText(f);
});

render();
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
})();
</script>
</body>
</html>
